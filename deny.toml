# Checked in CI by cargo-deny: known vulnerabilities, licences and where crates come from.

[advisories]
yanked = "deny"
ignore = [
    # Informational, no flaw: bincode's authors stopped and call 1.3.3 complete. syntect reads its
    # built-in grammars with it.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is complete; syntect reads its grammars with it" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
