[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lars-/gitcraft"

[workspace.dependencies]
gitcraft-core = { path = "crates/core", version = "0.3.0" }
gix = { version = "0.90", default-features = false, features = ["max-performance", "sha1", "excludes"] }
notify = "8.2"
thiserror = "2"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui_kittest = "0.37"
rfd = "0.17"
tempfile = "3"
proptest = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
strip = true
