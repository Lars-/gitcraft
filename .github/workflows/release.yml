name: Release

on:
  push:
    tags: ["v*"]
  # A change to how the downloads are made builds them all, to try them, without a release.
  pull_request:
    paths: [packaging/**, assets/icon/**, .github/workflows/release.yml]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runners, so the Linux builds run on older distributions too.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The Windows builds carry Microsoft's C runtime, so they start without the Visual C++
      # redistributable, which not every Windows has.
      - run: cargo build --release --locked -p gitcraft --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
      - name: Package
        shell: bash
        run: |
          id=$(cargo pkgid -p gitcraft)
          echo "version=${id##*@}" >> "$GITHUB_ENV"
          name="gitcraft-v${id##*@}-${{ matrix.target }}"
          binary=gitcraft
          if [[ "${{ matrix.target }}" == *windows* ]]; then binary=gitcraft.exe; fi
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/$binary" README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then 7z a -bso0 "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
      - name: Linux packages
        if: runner.os == 'Linux'
        run: packaging/linux.sh target/${{ matrix.target }}/release/gitcraft "$(uname -m)" "$version"
      # The package has to install, and GitCraft from both has to still run after ten seconds on a
      # virtual screen: when it cannot open its window, it stops at once.
      - name: Try the Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./gitcraft-*.deb desktop-file-utils xvfb
          desktop-file-validate /usr/share/applications/gitcraft.desktop
          xvfb-run -a timeout 10 gitcraft || test $? = 124
          xvfb-run -a timeout 10 ./gitcraft-*.AppImage --appimage-extract-and-run || test $? = 124
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = '${{ matrix.target }}'
          packaging/windows.ps1 "target/$target/release/gitcraft.exe" $target.Split('-')[0] $env:version
      # The installer has to put GitCraft in Program Files and the Start menu, GitCraft has to still
      # run after ten seconds, and uninstalling has to take both away again.
      - name: Try the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-Item gitcraft-*.msi).FullName
          $exe = "$env:ProgramFiles\GitCraft\gitcraft.exe"
          $menu = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\GitCraft.lnk"
          $setup = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn' -Wait -PassThru
          if ($setup.ExitCode -or -not (Test-Path $exe) -or -not (Test-Path $menu)) { throw "Not installed: $($setup.ExitCode)" }
          if ([IO.File]::ReadAllText($exe).Contains('VCRUNTIME140.dll')) { throw 'GitCraft needs the Visual C++ redistributable' }
          # The runners have no OpenGL 2, so GitCraft gets Mesa's beside it, which draws on the processor.
          $ProgressPreference = 'SilentlyContinue'
          $arch, $sum = if ('${{ matrix.target }}' -like 'aarch64*') { 'arm64', 'f238bfb90e2dfc5102cd4ff007ef00d9e8a8bb9dbc3e67556dce1291e752124e' } else { 'x64', '1910245962e3d854589ed11a9a488e84841a01559142fba8b81395271981700b' }
          Invoke-WebRequest "https://github.com/mmozeiko/build-mesa/releases/download/26.2.6/mesa-llvmpipe-$arch-26.2.6.7z" -OutFile mesa.7z
          if ((Get-FileHash mesa.7z).Hash -ne $sum) { throw 'The download of Mesa is not the one expected' }
          7z e -bso0 mesa.7z opengl32.dll "-o$env:ProgramFiles\GitCraft"
          $app = Start-Process $exe -PassThru -RedirectStandardError error.txt
          Start-Sleep 10
          if ($app.HasExited) { throw "GitCraft stopped with $($app.ExitCode): $(Get-Content error.txt)" }
          Stop-Process $app
          Start-Sleep 1
          Remove-Item "$env:ProgramFiles\GitCraft\opengl32.dll"
          $setup = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($setup.ExitCode -or (Test-Path $exe) -or (Test-Path $menu)) { throw "Not uninstalled: $($setup.ExitCode)" }
      - name: macOS disk image
        if: runner.os == 'macOS'
        run: |
          target=${{ matrix.target }}
          packaging/macos.sh "target/$target/release/gitcraft" "${target%%-*}" "$version"
      # The disk image has to open, with the app sealed as a whole, and the app has to still run
      # after ten seconds, started the way Finder does (only on the processor of this Mac).
      - name: Try the macOS disk image
        if: runner.os == 'macOS'
        run: |
          hdiutil attach -quiet gitcraft-*.dmg
          app=/Volumes/GitCraft/GitCraft.app
          codesign --verify --deep --strict "$app"
          plutil -lint "$app/Contents/Info.plist"
          test -L /Volumes/GitCraft/Applications
          if lipo "$app/Contents/MacOS/gitcraft" -verify_arch "$(uname -m)"; then
            open "$app"
            sleep 10
            pkill -x gitcraft
          fi
          hdiutil detach -quiet /Volumes/GitCraft
      - uses: softprops/action-gh-release@v3
        if: github.event_name == 'push'
        with:
          files: gitcraft-*.*

  # Once, after every build: with the notes generated in each matrix job they were appended six times.
  notes:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          notes=$(gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body)
          gh release edit "$GITHUB_REF_NAME" --notes "$notes"
