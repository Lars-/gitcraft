name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  # A pull request may not make GitCraft slower. Every benchmark is measured on the base branch
  # and on the pull request on the same machine, twice in opposite order, and a benchmark that is
  # more than 15% slower in both rounds fails the check.
  speed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GITCRAFT_BENCH_REPO: ${{ github.workspace }}/../git.git
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Clone git.git to measure against
        run: |
          git clone --bare --filter=blob:none --quiet https://github.com/git/git.git "$GITCRAFT_BENCH_REPO"
          git -C "$GITCRAFT_BENCH_REPO" commit-graph write --reachable
      - name: Measure
        run: |
          cp .github/speed-gate.py "$RUNNER_TEMP/"
          bench() { git checkout --quiet "$1" && cargo bench -p gitcraft-core --bench history -- "${@:2}"; }
          bench "$BASE" --save-baseline base || echo "::notice::The base branch has no benchmarks to compare with"
          bench "$HEAD" --baseline-lenient base
          python3 "$RUNNER_TEMP/speed-gate.py" record target/criterion "$RUNNER_TEMP/first.json"
          bench "$HEAD" --save-baseline head
          bench "$BASE" --baseline-lenient head || true
          python3 "$RUNNER_TEMP/speed-gate.py" record target/criterion "$RUNNER_TEMP/second.json" --reverse
      - run: python3 "$RUNNER_TEMP/speed-gate.py" judge 0.15 "$RUNNER_TEMP/first.json" "$RUNNER_TEMP/second.json"
